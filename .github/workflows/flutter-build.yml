name: Flutter Build

on:
  push:
  workflow_dispatch:
    inputs:
      build_android:
        description: Build Android
        type: boolean
        default: true
      build_windows:
        description: Build Windows
        type: boolean
        default: true
      build_linux:
        description: Build Linux
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter
      - run: flutter analyze
      - run: flutter test

  build-android:
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.build_android
    runs-on: ubuntu-latest
    env:
      KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEY }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: ./.github/actions/setup-flutter

      # android/app/build.gradle.kts uses flutter.ndkVersion; read it from the
      # Flutter SDK so the cache key follows Flutter upgrades. The env context
      # does not contain runner variables such as ANDROID_HOME, so expose the
      # cache path as a step output.
      - name: Read NDK version
        id: ndk
        run: |
          version=$(grep -oP 'val ndkVersion: String = "\K[^"]+' "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "path=$ANDROID_HOME/ndk/$version" >> "$GITHUB_OUTPUT"

      - name: Cache Android NDK
        uses: actions/cache@v6
        with:
          path: ${{ steps.ndk.outputs.path }}
          key: android-ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}

      # android/app/build.gradle.kts reads android/key.properties for release
      # signing. Without the secrets the build falls back to the debug key.
      - name: Configure release signing
        if: env.KEYSTORE != ''
        working-directory: android
        run: |
          echo "$KEYSTORE" | base64 --decode > app/keystore.jks
          {
            echo "storeFile=keystore.jks"
            echo "keyAlias=upload"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > key.properties

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Youtube-Downloader.apk

      - uses: actions/upload-artifact@v7
        with:
          name: Youtube-Downloader
          path: build/app/outputs/flutter-apk/Youtube-Downloader.apk
          archive: false

  build-linux:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libjson-glib-dev libmpv-dev mpv

      - uses: ./.github/actions/setup-flutter

      - uses: ./.github/actions/ffmpegkit
        with:
          platform: linux

      - name: Build Linux Release
        run: flutter build linux --release

      # ffmpeg is not bundled in the archive; the app uses the one from the PATH.
      - name: Package
        run: tar -czf Youtube-Downloader-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Build deb installer
        run: |
          version=$(grep -oP '^version:\s*\K[\d.]+' pubspec.yaml)
          bash installer/linux/build-deb.sh "$version" build/linux/x64/release/bundle "Youtube-Downloader-linux-x64.deb"

      - name: Upload Linux archive
        uses: actions/upload-artifact@v7
        with:
          path: Youtube-Downloader-linux-x64.tar.gz
          archive: false

      - name: Upload Linux deb installer
        uses: actions/upload-artifact@v7
        with:
          path: Youtube-Downloader-linux-x64.deb
          archive: false

  build-windows:
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.build_windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter

      - uses: ./.github/actions/ffmpegkit
        with:
          platform: windows

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Bundle ffmpeg.exe
        shell: pwsh
        run: Copy-Item ffmpegkit-bundle/ffmpeg.exe build/windows/x64/runner/Release/

      - name: Build MSI installer
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([\d.]+)').Matches[0].Groups[1].Value)
          $src = (Resolve-Path build/windows/x64/runner/Release).Path
          wix build installer/Package.wxs -ext WixToolset.UI.wixext -d Version=$version -d SourceDir=$src -arch x64 -o YouTube-Downloader-$version.msi

      - name: Upload Windows MSI installer
        uses: actions/upload-artifact@v7
        with:
          name: YouTube-Downloader-Windows-x64-MSI
          path: YouTube-Downloader-*.msi
          archive: false

      - name: Upload Windows portable app
        uses: actions/upload-artifact@v7
        with:
          name: YouTube-Downloader-Windows-x64-Portable
          path: build/windows/x64/runner/Release/
          archive: true

  # Push a tag like v0.1.0 to publish the APK and MSI as GitHub release assets.
  release:
    needs: [build-android, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Non-archived artifacts are named after their file.
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          pattern: '*.{apk,msi,tar.gz,deb}'
          path: assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" assets/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes