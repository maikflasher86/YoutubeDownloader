name: Flutter Build

on:
  push:
  workflow_dispatch:
    inputs:
      build_android:
        description: Build Android
        type: boolean
        default: true
      build_windows:
        description: Build Windows
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.build_android
    runs-on: ubuntu-latest
    env:
      KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEY }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - run: flutter pub get

      # android/app/build.gradle.kts reads android/key.properties for release
      # signing. Without the secrets the build falls back to the debug key.
      - name: Configure release signing
        if: env.KEYSTORE != ''
        working-directory: android
        run: |
          echo "$KEYSTORE" | base64 --decode > app/keystore.jks
          {
            echo "storeFile=keystore.jks"
            echo "keyAlias=upload"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > key.properties

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-Downloader
          path: build/app/outputs/flutter-apk/*-release.apk

  build-windows:
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.build_windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      # The app needs ffmpeg.exe next to the exe for MP3 and merging.
      - name: Bundle ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg
          Copy-Item (Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName build/windows/x64/runner/Release/

      - uses: actions/upload-artifact@v7
        with:
          name: YouTube-Downloader
          path: build/windows/x64/runner/Release/
          archive: false
