name: Flutter Build

on:
  push:
  workflow_dispatch:
    inputs:
      build_android:
        description: Build Android
        type: boolean
        default: true
      build_windows:
        description: Build Windows
        type: boolean
        default: true
      build_linux:
        description: Build Linux
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.build_android
    runs-on: ubuntu-latest
    env:
      KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEY }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - run: flutter pub get

      # android/app/build.gradle.kts reads android/key.properties for release
      # signing. Without the secrets the build falls back to the debug key.
      - name: Configure release signing
        if: env.KEYSTORE != ''
        working-directory: android
        run: |
          echo "$KEYSTORE" | base64 --decode > app/keystore.jks
          {
            echo "storeFile=keystore.jks"
            echo "keyAlias=upload"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > key.properties

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Youtube-Downloader.apk

      - uses: actions/upload-artifact@v7
        with:
          name: Youtube-Downloader
          path: build/app/outputs/flutter-apk/Youtube-Downloader.apk
          archive: false

  build-linux:
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.build_linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libjson-glib-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - run: flutter pub get

      # The ffmpeg_kit plugin downloads FFmpegKit during CMake. Cache it and
      # hand it over via FFMPEGKIT_LOCAL_DIR; keep the version in sync with the plugin.
      - name: Cache FFmpegKit
        id: ffmpegkit
        uses: actions/cache@v6
        with:
          path: ffmpegkit-bundle
          key: ffmpegkit-linux-x86_64-audio-8.1.2

      - name: Download FFmpegKit
        if: steps.ffmpegkit.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 -o ffmpegkit.tar.gz \
            https://github.com/sk3llo/ffmpeg_kit_flutter/releases/download/8.1.2-audio/ffmpeg-kit-linux-x86_64-audio-8.1.2.tar.gz
          mkdir ffmpegkit-bundle
          tar xzf ffmpegkit.tar.gz -C ffmpegkit-bundle

      - name: Build Linux Release
        env:
          FFMPEGKIT_LOCAL_DIR: ${{ github.workspace }}/ffmpegkit-bundle/ffmpeg-kit
        run: flutter build linux --release

      # ffmpeg is not bundled; the app uses the one from the PATH.
      - name: Package
        run: tar -czf Youtube-Downloader-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux archive
        uses: actions/upload-artifact@v7
        with:
          path: Youtube-Downloader-linux-x64.tar.gz
          archive: false
  build-windows:
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.build_windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - run: flutter pub get

      # The ffmpeg_kit plugin downloads FFmpegKit during CMake. Cache it and
      # hand it over via FFMPEGKIT_LOCAL_DIR; keep the version in sync with the plugin.
      - name: Cache FFmpegKit
        id: ffmpegkit
        uses: actions/cache@v6
        with:
          path: ffmpegkit-bundle
          key: ffmpegkit-windows-x86_64-audio-8.1.2

      - name: Download FFmpegKit
        if: steps.ffmpegkit.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 -o ffmpegkit.zip \
            https://github.com/sk3llo/ffmpeg_kit_flutter/releases/download/8.1.2-audio/ffmpeg-kit-windows-x86_64-audio-8.1.2.zip
          mkdir ffmpegkit-bundle
          unzip -q ffmpegkit.zip -d ffmpegkit-bundle

      - name: Build Windows Release
        env:
          FFMPEGKIT_LOCAL_DIR: ${{ github.workspace }}/ffmpegkit-bundle
        run: flutter build windows --release

      # The app needs ffmpeg.exe next to the exe for MP3 and merging.
      - name: Bundle ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg
          Copy-Item (Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName build/windows/x64/runner/Release/

      - name: Build MSI installer
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([\d.]+)').Matches[0].Groups[1].Value)
          $src = (Resolve-Path build/windows/x64/runner/Release).Path
          wix build installer/Package.wxs -ext WixToolset.UI.wixext -d Version=$version -d SourceDir=$src -arch x64 -o YouTube-Downloader-$version.msi

      - name: Upload Windows MSI installer
        uses: actions/upload-artifact@v7
        with:
          name: YouTube-Downloader-Windows-x64-MSI
          path: YouTube-Downloader-*.msi
          archive: false

      - name: Upload Windows portable app
        uses: actions/upload-artifact@v7
        with:
          name: YouTube-Downloader-Windows-x64-Portable
          path: build/windows/x64/runner/Release/
          archive: true

  # Push a tag like v0.1.0 to publish the APK and MSI as GitHub release assets.
  release:
    needs: [build-android, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Non-archived artifacts are named after their file.
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          pattern: '*.{apk,msi,tar.gz}'
          path: assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" assets/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes